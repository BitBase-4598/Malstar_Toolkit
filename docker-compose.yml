services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_PATH: /home/data/customer_remark.db
      STATIC_DIR: /app/frontend/dist
      FLASK_DEBUG: "false"
      CORS_ORIGINS: ""
    volumes:
      - sqlite-data:/home/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sqlite-data:
